---
layout: default
title: Pete Bachant
---

<div class="home" id="home">
  {% for post in paginator.posts %}
    <article class="post post-preview">
      <h1 class="postTitle"><a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a></h1>
      {% include post_meta.html post=post %}
      {{ post.content }}
    </article>
  {% endfor %}
  <!-- Pagination links -->
  <div class="pagination">
    {% if paginator.previous_page %}
      <a href="{{ paginator.previous_page_path | prepend: site.baseurl }}" class="next button__outline">&laquo; Newer Posts</a>
    {% endif %}
    {% if paginator.next_page %}
      <a href="{{ paginator.next_page_path | prepend: site.baseurl }}" class="previous button__outline">Older Posts &raquo;</a>
    {% endif %}
  </div>
</div>
