# Site settings
title: petebachant.me
include: ["_pages"]
# Jekyll's defaults, plus Calkit's project file
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - CNAME
  - calkit.yaml
email: petebachant@gmail.com
description: My personal website
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://petebachant.me" # the base hostname & protocol for your site
github_username:  petebachant
permalink: /:title/

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-redirect-from
  - jekyll-paginate

paginate: 2

navigation:
 - title: Home
   url: /index.html
 - title: Projects
   url: /projects
 - title: Posts
   url: /posts
 - title: Research
   url: /research

social:
   github: petebachant
   bluesky: petebachant.me
   mastodon: https://fediscience.org/@petebachant
   email: petebachant@gmail.com
   linkedin: petebachant

google_analytics: "UA-83958101-2"

# Comments via GitHub Discussions (https://giscus.app)
giscus:
  repo: petebachant/petebachant.github.io
  repo_id: MDEwOlJlcG9zaXRvcnk0MTY4MDg4Ng==
  category: Announcements
  category_id: DIC_kwDOAnv_9s4DJWy7

# Only for 'jekyll serve': have the browser check CSS and images again on
# each reload, so changes show without a hard refresh
webrick:
  headers:
    Cache-Control: no-cache
